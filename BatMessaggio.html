<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gotham - Messaggio</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    font-family: 'Cinzel', serif;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: radial-gradient(ellipse at top, #1a2438 0%, #0d1421 45%, #05070d 100%);
    position: relative;
  }

  body::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 20% 15%, rgba(230, 230, 255, 0.06) 0%, transparent 25%),
      radial-gradient(circle at 80% 70%, rgba(255, 215, 0, 0.04) 0%, transparent 30%);
    pointer-events: none;
  }

  h1 {
    color: #f4c542;
    font-size: 1.6rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    text-shadow: 0 0 12px rgba(244, 197, 66, 0.5);
    margin-bottom: 50px;
    text-align: center;
  }

  .buttons {
    display: flex;
    flex-direction: column;
    gap: 28px;
    z-index: 2;
  }

  .plaque-btn {
    position: relative;
    width: 260px;
    padding: 18px 20px;
    background: linear-gradient(180deg, #2b2b2f 0%, #131316 60%, #0a0a0c 100%);
    border: 2px solid #f4c542;
    border-radius: 10px;
    color: #f4c542;
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 1.15rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-shadow: 0 0 8px rgba(244, 197, 66, 0.4);
    cursor: pointer;
    text-decoration: none;
    display: block;
    text-align: center;
    box-shadow:
      0 0 0 1px rgba(244, 197, 66, 0.25) inset,
      0 4px 14px rgba(0, 0, 0, 0.6);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .plaque-btn::before,
  .plaque-btn::after,
  .plaque-btn span::before,
  .plaque-btn span::after {
    content: "";
    position: absolute;
    width: 14px;
    height: 14px;
    border: 2px solid #f4c542;
  }

  .plaque-btn::before { top: -2px; left: -2px; border-right: none; border-bottom: none; }
  .plaque-btn::after  { top: -2px; right: -2px; border-left: none; border-bottom: none; }
  .plaque-btn span::before { bottom: -2px; left: -2px; border-right: none; border-top: none; }
  .plaque-btn span::after  { bottom: -2px; right: -2px; border-left: none; border-top: none; }

  .plaque-btn:hover {
    transform: translateY(-2px);
    box-shadow:
      0 0 0 1px rgba(244, 197, 66, 0.5) inset,
      0 6px 18px rgba(244, 197, 66, 0.25);
  }

  .plaque-btn:active { transform: translateY(0); }
</style>
</head>
<body>

  <h1>Un messaggio per il nostro Batman</h1>

  <div class="buttons">
    <a class="plaque-btn" href="aurora.html">Cliccami!<span></span></a>
  </div>

</body>
</html>
